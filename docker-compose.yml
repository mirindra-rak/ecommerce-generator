services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmacie
      POSTGRES_PASSWORD: pharmacie
      POSTGRES_DB: pharmacie
    ports:
      - "5432:5432"
    volumes:
      - pharmacie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacie"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pharmacie-pgdata:
