name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Base PostgreSQL de test pour les tests d'intégration des repositories.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacie
          POSTGRES_PASSWORD: pharmacie
          POSTGRES_DB: pharmacie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pharmacie:pharmacie@localhost:5432/pharmacie_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pharmacie/core db:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
